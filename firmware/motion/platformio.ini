; RBG3-MOTION firmware (docs/spec/03-software.md §3, §8; pins: 02-electrical.md §3.1)
;   pio run -e esp32s3            build for the ESP32-S3-DevKitC-1
;   pio run -e esp32s3 -t upload  flash over the native USB port
;   pio test -e native            unit tests of lib/rbg3core on the host

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The Pi talks to the native USB port (USB CDC), not the UART bridge port.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wall
lib_deps =
    gin66/FastAccelStepper@^0.31.0
    teemuatlut/TMCStepper@^0.7.3
    madhephaestus/ESP32Servo@^3.0.5
    robtillaart/INA226@^0.6.0
    adafruit/Adafruit NeoPixel@^1.12.0

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
build_src_filter = -<*>
