<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RackBot Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">RackBot<span>Gen3</span></div>
  <div id="conn" class="pill off">offline</div>
  <div id="mstate" class="pill">—</div>
  <div id="mstep" class="muted"></div>
  <div class="spacer"></div>
  <label class="toggle"><input type="checkbox" id="auto"> auto mode</label>
  <button data-act="pause">Pause</button>
  <button data-act="resume">Resume</button>
  <button data-act="abort" class="danger">Abort</button>
  <button data-act="home">Home</button>
</header>

<div id="faultbar" hidden></div>

<main>
  <section class="card span2">
    <h2>Rack</h2>
    <div id="bays" class="bays"></div>
    <div class="row">
      <div><span class="muted">Spare S1 (good)</span> <b id="s1">—</b></div>
      <div><span class="muted">Spare S2 (RMA)</span> <b id="s2">—</b></div>
      <div><span class="muted">PLC</span> <b id="plc">—</b></div>
      <div><span class="muted">Lamp</span> <span id="lamp" class="lamp"></span></div>
    </div>
  </section>

  <section class="card">
    <h2>Robot</h2>
    <dl class="kv" id="robot"></dl>
  </section>

  <section class="card">
    <h2>Energy</h2>
    <dl class="kv" id="energy"></dl>
  </section>

  <section class="card">
    <h2>Camera</h2>
    <div class="camera"><img id="cam" alt="" hidden><span id="camtext" class="muted">no camera stream</span></div>
  </section>

  <section class="card" id="simcard" hidden>
    <h2>Simulator</h2>
    <div class="stack">
      <button id="estop" class="danger">Press robot E-stop</button>
      <button id="restock">Restock spare station</button>
      <p class="muted small">Restock = operator removes the RMA caddy from S2 and puts a good caddy in S1.</p>
    </div>
  </section>

  <section class="card span3">
    <h2>Jobs</h2>
    <table>
      <thead><tr><th>#</th><th>Bay</th><th>Source</th><th>Out</th><th>In</th><th>Result</th><th>Cycle</th><th>Wh</th><th>Detail</th></tr></thead>
      <tbody id="jobs"></tbody>
    </table>
  </section>

  <section class="card span3">
    <h2>Alarms &amp; log</h2>
    <ul id="events" class="events"></ul>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
