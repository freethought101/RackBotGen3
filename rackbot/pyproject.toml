[project]
name = "rackbot"
version = "0.1.0"
description = "RackBotGen3 Raspberry Pi application (mission, rack, vision, dashboard)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "pyserial-asyncio>=0.6",
    "pymodbus>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# picamera2 and python3-opencv come from apt on the Pi (system site-packages).
pi = ["pupil-apriltags>=1.0.4"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rackbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
